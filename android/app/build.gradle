plugins { id 'com.android.application' }
android {
  namespace 'com.soma.calendar'
  compileSdk 35
  defaultConfig {
    applicationId 'com.soma.calendar.preview'
    minSdk 26
    targetSdk 35
    versionCode 6
    versionName '0.6.0'
  }
  buildTypes { release { minifyEnabled false } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
// Offline asset origin is served by the platform WebViewClient. No AndroidX dependency.
