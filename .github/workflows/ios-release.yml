name: iOS release to TestFlight
# Runs on a version tag (v0.8.0) or by hand. Needs these repository secrets from the Apple Developer account:
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contents of the .p8 App Store Connect API key, role App Manager)
# Signing is automatic: Xcode creates the certificate and profiles through the API key. Nothing is submitted for App Review;
# the build only lands in TestFlight.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check Apple secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$KEY" ]; then
            echo "::error::Add APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 as repository secrets first (see ios/App/README.md)."; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund && npm test
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        run: brew install xcodegen && (cd ios/App && xcodegen generate) && npx cap sync ios && (cd ios/App && xcodegen generate)
      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"
      - name: Archive
        working-directory: ios/App
        run: |
          set -o pipefail
          BUILD=$(( 1000 + GITHUB_RUN_NUMBER ))
          VERSION=$(node -p "require('../../package.json').version")
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Soma.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" | tail -40
      - name: Upload to TestFlight
        working-directory: ios/App
        run: |
          set -o pipefail
          /usr/libexec/PlistBuddy -c "Set :teamID ${{ secrets.APPLE_TEAM_ID }}" ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Soma.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" | tail -40
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
