name: Build Soma debug APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, redesign/gujarati-time]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JS transpiler
        run: npm install --no-audit --no-fund
      - name: Browser for the accessibility gate
        run: npm install --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Test calendar calculations, translations and accessibility
        run: npm test
      - name: Bundle redesigned Soma
        run: npm run bundle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        shell: bash
        run: |
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKM"
          "$SDKM" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android debug APK
        working-directory: android
        env:
          SOMA_BUILD: ${{ github.run_number }}
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: soma-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Every build of main (and of the old redesign branch) replaces the rolling "preview" release. Soma Preview reads its
  # version.json (You > Updates) and installs the newer APK in place, so nothing is downloaded by hand.
  publish-preview:
    needs: apk
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/redesign/gujarati-time')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-preview
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: soma-debug-apk
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
          MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          mv app-debug.apk soma-preview.apk
          base="https://github.com/$GH_REPO/releases/download/preview"
          jq -n --argjson code "$((1000 + RUN))" --arg name "0.8.0-b$RUN" --arg sha "${GITHUB_SHA::7}" \
            --arg notes "$(printf '%s' "$MESSAGE" | head -n 1)" --arg apk "$base/soma-preview.apk" \
            --arg sum "$(sha256sum soma-preview.apk | cut -d' ' -f1)" --argjson size "$(stat -c%s soma-preview.apk)" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionCode:$code,versionName:$name,commit:$sha,notes:$notes,apk:$apk,sha256:$sum,size:$size,published:$at}' > version.json
          cat version.json
          gh release delete preview --cleanup-tag --yes 2>/dev/null || true
          gh release create preview soma-preview.apk version.json --prerelease --target "$GITHUB_SHA" \
            --title "Soma Preview (latest build)" \
            --notes "Build $RUN from ${GITHUB_SHA::7}. Soma Preview updates itself from here: You > Updates. To install by hand, download soma-preview.apk."
