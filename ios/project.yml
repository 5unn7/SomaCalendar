# Soma for iOS. Generate the Xcode project with `xcodegen` (see ios/README.md); the .xcodeproj is not committed.
# The app is a native shell around the same HTML/JS as Android: `npm run bundle` writes android/app/src/main/assets,
# and that folder is copied into the app bundle as `assets/`. UI changes live in src/redesign only.
name: Soma
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    # Permanent IDs once the first build is uploaded. Override with SOMA_BUNDLE_ID=... on the xcodebuild line.
    SOMA_BUNDLE_ID: app.soma.calendar
    MARKETING_VERSION: 0.7.0
    CURRENT_PROJECT_VERSION: 7
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Soma:
    type: application
    platform: iOS
    sources:
      - path: Soma
      - path: ../android/app/src/main/assets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SOMA_BUNDLE_ID)
        PRODUCT_NAME: Soma
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Soma/Soma.entitlements
        INFOPLIST_FILE: Soma/Info.plist
    dependencies:
      - target: SomaWidget
        embed: true
  SomaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SomaWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SOMA_BUNDLE_ID).widget
        PRODUCT_NAME: SomaWidget
        CODE_SIGN_ENTITLEMENTS: SomaWidget/SomaWidget.entitlements
        INFOPLIST_FILE: SomaWidget/Info.plist
        SKIP_INSTALL: YES
  SomaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SomaTests
      - path: Shared
    dependencies:
      - target: Soma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SOMA_BUNDLE_ID).tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Soma.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Soma
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Soma:
    build:
      targets:
        Soma: all
        SomaTests: [test]
    test:
      targets:
        - SomaTests
    archive:
      config: Release
